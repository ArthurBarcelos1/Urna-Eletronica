<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica 2026</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: var(--font-official);
        }

        .hub-box {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .hub-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f8fafc;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .buttons-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-screen {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-screen:hover {
            transform: translateY(-3px) scale(1.01);
            filter: brightness(1.1);
        }

        .btn-urna {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        .btn-teclado {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
        }

        .btn-mesario {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        }

        .btn-simulador {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        }

        .btn-screen span:last-child {
            font-size: 1.4rem;
        }
    </style>
</head>
<body>

    <main class="hub-box">
        <h1 class="hub-title">Urna Eletrônica 2026</h1>

        <div class="buttons-list">
            <a href="urna.html" target="_blank" class="btn-screen btn-urna">
                <span>🖥️ Visor da Urna</span>
                <span>↗</span>
            </a>

            <a href="teclado.html" target="_blank" class="btn-screen btn-teclado">
                <span>📱 Teclado (Celular)</span>
                <span>↗</span>
            </a>

            <a href="mesario.html" target="_blank" class="btn-screen btn-mesario">
                <span>💼 Terminal do Mesário</span>
                <span>↗</span>
            </a>

            <a href="simulador.html" target="_blank" class="btn-screen btn-simulador">
                <span>🚀 Simulador Completo (3 em 1)</span>
                <span>↗</span>
            </a>
        </div>
    </main>

</body>
</html>
